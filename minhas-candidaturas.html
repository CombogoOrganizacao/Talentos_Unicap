<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Minhas Candidaturas - TalentoUNICAP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Schibsted+Grotesk:wght@600;700;800&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <link rel="icon" type="image/png" href="img/asabranca_Unicap.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/tema-unicap.css">
<link rel="stylesheet" href="css/interno.css">
</head>

<body>
  <nav class="navbar" data-area="aluno"></nav>
  <script src="js/components/navbar.js"></script>

  <main class="container page-shell page-shell--inbox">
    <div class="page-intro">
      <p class="eyebrow"><i class="ph-fill ph-paper-plane-tilt"></i> Candidaturas</p>
      <div class="page-intro-row">
        <div>
          <h1 class="page-title">Minhas Candidaturas</h1>
          <p class="page-desc">Acompanhe o andamento das vagas para as quais você se candidatou.</p>
        </div>
        <a class="btn btn-secondary" href="lista-vagas.html">
          <i class="ph-fill ph-arrow-left"></i> Voltar para vagas
        </a>
      </div>
    </div>

    <div id="candidaturasContainer" class="page-stack">
      <p class="aviso-vazio">Carregando candidaturas...</p>
    </div>
  </main>

  <footer class="footer">© 2026 TalentoUNICAP — Universidade Católica de Pernambuco</footer>

  <template id="candidaturaTemplate">
    <article class="card candidatura-card">
      <div class="candidatura-topo">
        <div>
          <h2 data-role="titulo"></h2>
          <p class="candidatura-empresa" data-role="empresa"></p>
        </div>
        <span class="badge" data-role="status"></span>
      </div>

      <div class="meta">
        <span data-role="modalidade"></span>
        <span data-role="local"></span>
        <span data-role="remuneracao"></span>
      </div>

      <p class="candidato-meta">
        <span>Candidatura enviada em <span data-role="data"></span></span>
        <span data-role="prazo"></span>
      </p>

      <p class="candidatura-aviso" data-role="aviso" hidden></p>

      <div class="candidato-acoes">
        <button class="btn btn-outline btn-sm" type="button" data-role="cancelar">
          Cancelar candidatura
        </button>
        <a class="btn btn-primary btn-sm" href="lista-vagas.html" data-role="reenviar" hidden>
          Candidatar-se novamente
        </a>
      </div>
    </article>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config/config.js"></script>
  <script src="js/config/supabase-client.js"></script>
  <script src="js/security/auth.js"></script>
  <script src="js/services/candidatura-service.js"></script>
  <script src="js/pages/minhas-candidaturas.js"></script>
  <script src="js/utils/page-nav.js" defer></script>
  <script src="js/utils/ux.js" defer></script>
  <script src="js/utils/mobile-nav.js" defer></script>
<script src="js/components/theme-toggle.js"></script>
<script src="js/components/scroll-fx.js"></script>
  <script src="js/components/bg-icons.js" defer></script>
</body>

</html>
