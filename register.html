<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta - TalentoUNICAP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Schibsted+Grotesk:wght@600;700;800&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <link rel="icon" type="image/png" href="img/asabranca_Unicap.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/tema-unicap.css">
<link rel="stylesheet" href="css/interno.css">
</head>

<body>
  <nav class="navbar" data-area="cadastro"></nav>
  <script src="js/components/navbar.js"></script>
  <div class="auth-page">
    <div class="card auth-card">
      <div class="card-body">
        <h1>Criar sua conta</h1>
        <p class="subtitle">Comece a construir seu currículo profissional</p>
<div id="jaLogado" class="hidden text-center">
          <h1>Você já está conectado</h1>
          <p class="subtitle" id="jaLogadoMsg"></p>
          <button type="button" class="btn btn-primary w-full" id="btnContinuar">Continuar</button>
          <button type="button" class="btn btn-secondary w-full mt-3" id="btnOutraConta">Entrar com outra conta</button>
        </div>
                <div id="errorMsg" class="error-msg hidden"></div>
        <form id="registerForm">
          <div class="form-group">
            <label>Nome completo</label>
            <input type="text" id="name" placeholder="Seu nome" required>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="seu@email.com" required>
          </div>
          <div class="form-group">
            <label>Senha</label>
            <input type="password" id="password" placeholder="Mínimo 6 caracteres" minlength="6" required>
          </div>
          <div class="form-group">
            <label>Confirmar senha</label>
            <input type="password" id="confirmPassword" placeholder="Repita a senha" required>
          </div>
          <button type="submit" class="btn btn-primary w-full" id="registerBtn">Criar Conta</button>
        </form>
        <p class="text-center text-muted mt-5 auth-foot">
          Já tem uma conta? <a href="login.html">Entrar</a>
        </p>
      </div>
    </div>
  </div>
  <footer class="footer">© 2026 TalentoUNICAP — Universidade Católica de Pernambuco</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config/config.js"></script>
  <script src="js/config/supabase-client.js"></script>
  <script src="js/services/aluno-service.js"></script>
  <script src="js/security/auth.js"></script>
  <script>
    // Se já existe sessão, NÃO redireciona sozinho (ex.: ao voltar com a seta
    // do navegador). Pergunta se a pessoa quer continuar ou trocar de conta.
    Auth.onAuthChange = function (loggedIn, tipoConta) {
      if (!loggedIn) return;

      const aviso = document.getElementById('jaLogado');
      const form = document.getElementById('registerForm');
      const titulo = document.querySelector('.auth-card .card-body > h2');
      const subtitulo = document.querySelector('.auth-card .card-body > .subtitle');
      const erro = document.getElementById('errorMsg');

      document.getElementById('jaLogadoMsg').textContent =
        'Conectado como ' + (Auth.user?.nome || Auth.user?.email || 'usuário') + '.';

      [titulo, subtitulo, erro, form].forEach(el => el && el.classList.add('hidden'));
      document.querySelectorAll('.auth-card .card-body > p').forEach(p => p.classList.add('hidden'));
      aviso.classList.remove('hidden');

      document.getElementById('btnContinuar').onclick = function () {
        (window.navegarComTransicao || function (u) { window.location.href = u; })((tipoConta === 'empresa' ? 'busca-talentos.html' : 'dashboard.html'));
      };

      document.getElementById('btnOutraConta').onclick = async function () {
        await Auth.logout(false);
        aviso.classList.add('hidden');
        [titulo, subtitulo, form].forEach(el => el && el.classList.remove('hidden'));
        document.querySelectorAll('.auth-card .card-body > p').forEach(p => p.classList.remove('hidden'));
      };
    };

    Auth.init();

    // Nome digitado na prévia da página inicial (fica só nesta aba do navegador)
    (function () {
      var campo = document.getElementById('name');
      var nome = '';
      try { nome = sessionStorage.getItem('talento-prefill-nome') || ''; } catch (e) {}
      if (campo && !campo.value && nome) campo.value = nome.slice(0, 60);
    })();

    document.getElementById('registerForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirmPassword').value;
      const btn = document.getElementById('registerBtn');
      const errDiv = document.getElementById('errorMsg');

      errDiv.classList.add('hidden');
      errDiv.textContent = '';

      if (!name) {
        errDiv.textContent = 'Informe seu nome completo.';
        errDiv.classList.remove('hidden');
        return;
      }

      if (password !== confirm) {
        errDiv.textContent = 'As senhas não coincidem.';
        errDiv.classList.remove('hidden');
        return;
      }

      if (password.length < 6) {
        errDiv.textContent = 'A senha deve ter pelo menos 6 caracteres.';
        errDiv.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Criando...';

      try {
        const result = await Auth.register(name, email, password);

        if (result.requiresEmailConfirmation) {
          (window.navegarComTransicao || function (u) { window.location.href = u; })(`confirmacao-email.html?email=${encodeURIComponent(email)}&tipo=aluno`);
          return;
        }

        (window.navegarComTransicao || function (u) { window.location.href = u; })('dashboard.html');

      } catch (error) {
        console.error('Erro ao criar conta:', error);

        errDiv.textContent = error.message || 'Erro ao criar conta.';
        errDiv.classList.remove('hidden');

        btn.disabled = false;
        btn.textContent = 'Criar Conta';
      }
    });
  </script>
  <script src="js/utils/ux.js" defer></script>
  <script src="js/utils/mobile-nav.js" defer></script>
<script src="js/components/theme-toggle.js"></script>
<script src="js/components/scroll-fx.js"></script>
  <script src="js/components/bg-icons.js" defer></script>
</body>

</html>
