<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta - TalentoUNICAP</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand">
        <img src="img/asabranca_Unicap.png" width="40px" alt="">
        Talento<span>UNICAP</span>
      </a>
      <div class="nav-links"><a href="login.html" class="btn btn-secondary btn-sm">Entrar</a></div>
    </div>
  </nav>
  <div class="auth-page">
    <div class="card auth-card">
      <div class="card-body">
        <h2>Criar sua conta</h2>
        <p class="subtitle">Comece a construir seu currículo profissional</p>
        <div id="errorMsg" class="error-msg hidden"></div>
        <form id="registerForm">
          <div class="form-group">
            <label>Nome completo</label>
            <input type="text" id="name" placeholder="Seu nome" required>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="seu@email.com" required>
          </div>
          <div class="form-group">
            <label>Senha</label>
            <input type="password" id="password" placeholder="Mínimo 6 caracteres" minlength="6" required>
          </div>
          <div class="form-group">
            <label>Confirmar senha</label>
            <input type="password" id="confirmPassword" placeholder="Repita a senha" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;" id="registerBtn">Criar Conta</button>
        </form>
        <p style="text-align:center;margin-top:20px;font-size:14px;color:var(--gray-600);">
          Já tem uma conta? <a href="login.html">Entrar</a>
        </p>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config/config.js"></script>
  <script src="js/config/supabase-client.js"></script>
  <script src="js/services/aluno-service.js"></script>
  <script src="js/security/auth.js"></script>
  <script>
    Auth.onAuthChange = function (loggedIn, tipoConta) {
      if (loggedIn) window.location.href = tipoConta === 'empresa' ? 'busca-talentos.html' : 'dashboard.html';
    };

    Auth.init();

    document.getElementById('registerForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirmPassword').value;
      const btn = document.getElementById('registerBtn');
      const errDiv = document.getElementById('errorMsg');

      errDiv.classList.add('hidden');
      errDiv.textContent = '';

      if (!name) {
        errDiv.textContent = 'Informe seu nome completo.';
        errDiv.classList.remove('hidden');
        return;
      }

      if (password !== confirm) {
        errDiv.textContent = 'As senhas não coincidem.';
        errDiv.classList.remove('hidden');
        return;
      }

      if (password.length < 6) {
        errDiv.textContent = 'A senha deve ter pelo menos 6 caracteres.';
        errDiv.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Criando...';

      try {
        // Um único request no backend já cria o Usuario (ALUNO) e devolve
        // o token JWT - não existe mais um segundo passo de "criar perfil".
        await Auth.register(name, email, password);

        window.location.href = 'dashboard.html';

      } catch (error) {
        console.error('Erro ao criar conta:', error);

        errDiv.textContent = error.message || 'Erro ao criar conta.';
        errDiv.classList.remove('hidden');

        btn.disabled = false;
        btn.textContent = 'Criar Conta';
      }
    });
  </script>
</body>

</html>
