<!DOCTYPE html>

<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Confirmar E-mail - TalentoUNICAP</title>


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Schibsted+Grotesk:wght@600;700;800&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <link rel="icon" type="image/png" href="img/asabranca_Unicap.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/tema-unicap.css">
<link rel="stylesheet" href="css/interno.css">
</head>

<body>

  <nav class="navbar" data-area="simples"></nav>
  <script src="js/components/navbar.js"></script>

  <div class="auth-page">


<div class="card auth-card">

  <div class="card-body text-center">

    <!-- ÍCONE -->
    <div id="statusIcon" class="status-icon" aria-hidden="true"><i class="ph-fill ph-envelope-simple"></i></div>

    <!-- TÍTULO -->
    <h1 id="title">
      Confirme seu e-mail
    </h1>

    <!-- MENSAGEM -->
    <p
      id="message"
      class="subtitle"
    >
      Enviamos um link de confirmação para o seu e-mail.
    </p>

    <!-- E-MAIL -->
    <div id="emailBox" class="email-box"></div>

    <!-- REENVIO -->
    <div id="resendArea">

      <p class="text-sm text-muted mb-3">
        Não recebeu? Verifique o spam ou solicite um novo e-mail.
      </p>

      <button
        id="resendBtn"
        class="btn btn-primary w-full"
       
      >
        Reenviar confirmação
      </button>

      <div
        id="feedback"
        class="error-msg hidden mt-3"
       
      >
      </div>

    </div>

    <!-- LOGIN -->
    <a
      id="loginLink"
      href="login.html"
      class="btn btn-secondary w-full mt-3"
    >
      Voltar para o login
    </a>

  </div>

</div>

  </div>

  <!-- SUPABASE -->

  <footer class="footer">© 2026 TalentoUNICAP — Universidade Católica de Pernambuco</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- CONFIG -->

  <script src="js/config/config.js"></script>

  <!-- CLIENT -->

  <script src="js/config/supabase-client.js"></script>

  <!-- AUTH -->

  <script src="js/security/auth.js"></script>

  <script>

    // =========================================================
    // ELEMENTOS
    // =========================================================

    const statusIcon = document.getElementById('statusIcon');
    const title = document.getElementById('title');
    const message = document.getElementById('message');
    const emailBox = document.getElementById('emailBox');
    const resendArea = document.getElementById('resendArea');
    const resendBtn = document.getElementById('resendBtn');
    const feedback = document.getElementById('feedback');
    const loginLink = document.getElementById('loginLink');


    // =========================================================
    // PARÂMETROS DA URL
    // =========================================================

    const params = new URLSearchParams(window.location.search);

    const email = params.get('email') || '';
    const tipo = params.get('tipo') || 'aluno';

    const code = params.get('code');

    const errorParam = params.get('error');
    const errorDescription = params.get('error_description');


    // =========================================================
    // EMAIL INICIAL
    // =========================================================

    emailBox.textContent =
      email ||
      'Confira a caixa de entrada do e-mail utilizado no cadastro.';


    // =========================================================
    // FUNÇÃO — MOSTRAR CONFIRMAÇÃO
    // =========================================================

    function mostrarConfirmacao(user) {

      statusIcon.innerHTML = '<i class="ph-fill ph-check-circle"></i>';
      statusIcon.classList.add('is-ok');

      title.textContent = 'E-mail confirmado!';

      message.textContent =
        'Sua conta foi ativada com sucesso. Você já pode acessar a plataforma.';

      emailBox.textContent =
        user?.email ||
        email ||
        'E-mail confirmado com sucesso.';

      resendArea.style.display = 'none';

      loginLink.textContent = 'Ir para o login';

      loginLink.href = 'login.html';

    }


    // =========================================================
    // FUNÇÃO — MOSTRAR ERRO
    // =========================================================

    function mostrarErro(mensagemErro) {

      statusIcon.innerHTML = '<i class="ph-fill ph-x-circle"></i>';
      statusIcon.classList.add('is-erro');

      title.textContent = 'Não foi possível confirmar o e-mail';

      message.textContent =
        mensagemErro ||
        'O link de confirmação é inválido ou expirou.';

      emailBox.textContent = '';

      resendArea.style.display = 'none';

      loginLink.textContent = 'Voltar para o login';

      loginLink.href = 'login.html';

    }


    // =========================================================
    // REENVIO DE CONFIRMAÇÃO
    // =========================================================

    resendBtn.addEventListener('click', async () => {

      const address =
        email ||
        prompt('Digite o e-mail cadastrado:');

      if (!address) {
        return;
      }

      resendBtn.disabled = true;
      resendBtn.textContent = 'Enviando...';

      feedback.classList.add('hidden');

      try {

        await Auth.resendConfirmation(address);

        feedback.className = '';

        feedback.style.cssText = `
          margin-top:12px;
          padding:12px;
          border-radius:8px;
          background:#ecfdf5;
          color:#166534;
          font-size:13px;
        `;

        feedback.textContent =
          'E-mail de confirmação reenviado. Confira sua caixa de entrada e o spam.';

      } catch (error) {

        feedback.classList.remove('hidden');

        feedback.textContent =
          error?.message ||
          'Não foi possível reenviar o e-mail.';

      } finally {

        resendBtn.disabled = false;

        resendBtn.textContent =
          'Reenviar confirmação';

      }

    });


    // =========================================================
    // PROCESSAR CONFIRMAÇÃO
    // =========================================================

    (async () => {

      try {

        // -------------------------------------------------------
        // 1. SE O SUPABASE RETORNOU UM ERRO
        // -------------------------------------------------------

        if (errorParam) {

          console.error(
            'Erro retornado pelo Supabase:',
            errorParam,
            errorDescription
          );

          mostrarErro(
            errorDescription
              ? decodeURIComponent(errorDescription.replace(/\+/g, ' '))
              : 'O link de confirmação é inválido ou expirou.'
          );

          return;
        }


        // -------------------------------------------------------
        // 2. FLUXO PKCE / CODE
        // -------------------------------------------------------

        if (code) {

          console.log(
            'Código de confirmação encontrado. Trocando por sessão...'
          );

          const {
            data,
            error
          } = await supabaseClient.auth.exchangeCodeForSession(code);

          if (error) {

            console.error(
              'Erro ao trocar código por sessão:',
              error
            );

            mostrarErro(
              'O link de confirmação é inválido, expirou ou já foi utilizado.'
            );

            return;
          }

          if (data?.session?.user) {

            console.log(
              'Sessão criada após confirmação:',
              data.session.user.id
            );

            mostrarConfirmacao(data.session.user);

            return;
          }

        }


        // -------------------------------------------------------
        // 3. DAR TEMPO PARA O SUPABASE PROCESSAR O HASH
        // -------------------------------------------------------

        await new Promise(resolve => setTimeout(resolve, 300));


        // -------------------------------------------------------
        // 4. VERIFICAR SESSÃO
        // -------------------------------------------------------

        let {
          data: {
            session
          }
        } = await supabaseClient.auth.getSession();


        // -------------------------------------------------------
        // 5. SE NÃO HOUVER SESSÃO, ESPERAR SIGNED_IN
        // -------------------------------------------------------

        if (!session) {

          console.log(
            'Nenhuma sessão encontrada imediatamente. Aguardando autenticação...'
          );

          const sessionResult = await new Promise(resolve => {

            let finalizado = false;

            const timeout = setTimeout(() => {

              if (finalizado) {
                return;
              }

              finalizado = true;

              resolve(null);

            }, 5000);


            const {
              data: listener
            } = supabaseClient.auth.onAuthStateChange(
              (event, currentSession) => {

                console.log(
                  'Evento Auth:',
                  event
                );

                if (
                  event === 'SIGNED_IN' ||
                  event === 'INITIAL_SESSION'
                ) {

                  if (currentSession) {

                    clearTimeout(timeout);

                    if (!finalizado) {

                      finalizado = true;

                      resolve(currentSession);

                    }

                    listener.subscription.unsubscribe();

                  }

                }

              }
            );

          });

          session = sessionResult;
        }


        // -------------------------------------------------------
        // 6. CONFIRMADO
        // -------------------------------------------------------

        if (session?.user) {

          console.log(
            'E-mail confirmado:',
            session.user.email
          );

          mostrarConfirmacao(session.user);

          return;
        }


        // -------------------------------------------------------
        // 7. NENHUMA SESSÃO
        // -------------------------------------------------------

        console.log(
          'Nenhuma sessão encontrada.'
        );

        // Não mostramos erro aqui.
        // O usuário pode simplesmente ter chegado
        // nesta página diretamente após o cadastro.

      } catch (error) {

        console.error(
          'Erro ao processar confirmação:',
          error
        );

        mostrarErro(
          'Ocorreu um erro ao confirmar seu e-mail. Tente solicitar um novo link.'
        );

      }

    })();

  </script>

  <script src="js/utils/ux.js" defer></script>
  <script src="js/utils/mobile-nav.js" defer></script>
<script src="js/components/theme-toggle.js"></script>
<script src="js/components/scroll-fx.js"></script>
  <script src="js/components/bg-icons.js" defer></script>
</body>

</html>
