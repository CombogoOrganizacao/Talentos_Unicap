<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - TalentoUNICAP</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand">
        <img src="img/asabranca_Unicap.png" width="40px" alt="">
        Talento<span>UNICAP</span>
      </a>

      <div class="nav-links"><a href="register.html" class="btn btn-primary btn-sm">Criar Conta</a></div>
    </div>
  </nav>
  <div class="auth-page">
    <div class="card auth-card">
      <div class="card-body">
        <h2>Bem-vindo de volta</h2>
        <p class="subtitle">Entre na sua conta para acessar seu currículo</p>

        <!-- Conta de teste: inserida pelo DataLoader do backend somente
             quando o banco está vazio (ver BackendApplication -> DataLoader.java) -->
        <div
          style="background:var(--unicap-50);border:1px solid var(--unicap-200);border-radius:8px;padding:14px;margin-bottom:20px;">
          <p style="font-size:13px;font-weight:600;color:var(--unicap-600);margin-bottom:6px;">🧪 Conta de Teste (aluno)</p>
          <p style="font-size:12px;color:var(--gray-600);margin:2px 0;">📧 <strong>kaualucasds21@gmail.com</strong></p>
          <p style="font-size:12px;color:var(--gray-600);margin:2px 0;">🔑 <strong>1234567890</strong></p>
          <button onclick="fillTestAccount()"
            style="margin-top:8px;font-size:12px;color:var(--unicap-500);background:none;border:none;cursor:pointer;text-decoration:underline;">Preencher
            automaticamente</button>
        </div>

        <div id="errorMsg" class="error-msg hidden"></div>
        <form id="loginForm">
          <div class="form-group">
            <label>CNPJ ou E-mail</label>
            <input type="text" id="email" inputmode="email" placeholder="seu@email.com ou CNPJ da empresa">
          </div>
          <div class="form-group">
            <label>Senha</label>
            <input type="password" id="password" placeholder="••••••" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;" id="loginBtn">Entrar</button>
        </form>
        <p style="text-align:center;margin-top:20px;font-size:14px;color:var(--gray-600);">
          Não tem uma conta? <a href="register.html">Criar conta de aluno</a><br>
          <span style="font-size:13px;">É uma empresa? <a href="cadastro-empresa.html">Cadastre sua empresa aqui</a></span>
        </p>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config/config.js"></script>
  <script src="js/security/http.js"></script>
  <script src="js/services/aluno-service.js"></script>
  <script src="js/security/auth.js"></script>
  <script src="js/services/empresa-service.js"></script>
  <script>
    // Redireciona de acordo com o tipo de conta: empresa -> painel de busca
    // de talentos; aluno -> editor de currículo.
    function destinoPorTipoConta(tipoConta) {
      return tipoConta === 'empresa' ? 'busca-talentos.html' : 'dashboard.html';
    }

    Auth.onAuthChange = function (loggedIn, tipoConta) {
      if (loggedIn) window.location.href = destinoPorTipoConta(tipoConta);
    };

    Auth.init();

    function fillTestAccount() {
      document.getElementById('email').value = 'kaualucasds21@gmail.com';
      document.getElementById('password').value = '1234567890';
    }

    // Aceita e-mail (aluno/empresa) ou CNPJ (empresa) no mesmo campo -
    // é o backend quem resolve qual dos dois foi digitado.

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const identifier = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const errDiv = document.getElementById('errorMsg');

      if (!identifier) {
        errDiv.textContent = 'Digite seu e-mail ou o CNPJ da empresa.';
        errDiv.classList.remove('hidden');
        return;
      }
      if (!password) {
        errDiv.textContent = 'Digite sua senha.';
        errDiv.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Entrando...';
      errDiv.classList.add('hidden');

      try {
        const user = await Auth.loginWithIdentifier(identifier, password);
        window.location.href = destinoPorTipoConta(user.tipoConta);
      } catch (error) {
        console.error('Erro ao fazer login:', error);

        errDiv.textContent =
          error.message || 'Email/CNPJ ou senha incorretos';

        errDiv.classList.remove('hidden');

        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });
  </script>
</body>

</html>
