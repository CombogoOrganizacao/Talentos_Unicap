<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - TalentoUNICAP</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand">
        <img src="img/asabranca_Unicap.png" width="40px" alt="">
        Talento<span>UNICAP</span>
      </a>

      <div class="nav-links"><a href="register.html" class="btn btn-primary btn-sm">Criar Conta</a></div>
    </div>
  </nav>
  <div class="auth-page">
    <div class="card auth-card">
      <div class="card-body">
        <h2>Bem-vindo de volta</h2>
        <p class="subtitle">Entre na sua conta para acessar seu currículo</p>

        <!-- Conta de teste -->
        <div
          style="background:var(--unicap-50);border:1px solid var(--unicap-200);border-radius:8px;padding:14px;margin-bottom:20px;">
          <p style="font-size:13px;font-weight:600;color:var(--unicap-600);margin-bottom:6px;">🧪 Conta de Teste</p>
          <p style="font-size:12px;color:var(--gray-600);margin:2px 0;">📧 <strong>admin@unicap.edu.br</strong></p>
          <p style="font-size:12px;color:var(--gray-600);margin:2px 0;">🔑 <strong>123456</strong></p>
          <button onclick="fillTestAccount()"
            style="margin-top:8px;font-size:12px;color:var(--unicap-500);background:none;border:none;cursor:pointer;text-decoration:underline;">Preencher
            automaticamente</button>
        </div>

        <div id="errorMsg" class="error-msg hidden"></div>
        <form id="loginForm">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="seu@email.com" required>
          </div>
          <div class="form-group">
            <label>Senha</label>
            <input type="password" id="password" placeholder="••••••" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;" id="loginBtn">Entrar</button>
        </form>
        <p style="text-align:center;margin-top:20px;font-size:14px;color:var(--gray-600);">
          Não tem uma conta? <a href="register.html">Criar conta</a>
        </p>
      </div>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <script src="js/config.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    Auth.onAuthChange = function (loggedIn) {
      if (loggedIn) window.location.href = 'dashboard.html';
    };

    Auth.init();

    function fillTestAccount() {
      document.getElementById('email').value = 'admin@unicap.edu.br';
      document.getElementById('password').value = '123456';
    }

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const errDiv = document.getElementById('errorMsg');

      btn.disabled = true;
      btn.textContent = 'Entrando...';
      errDiv.classList.add('hidden');

      try {
        await Auth.login(email, password);
        window.location.href = 'dashboard.html';
      } catch (error) {
        console.error('Erro ao fazer login:', error);

        errDiv.textContent =
          error.message || 'Email ou senha incorretos';

        errDiv.classList.remove('hidden');

        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });
  </script>
</body>

</html>
