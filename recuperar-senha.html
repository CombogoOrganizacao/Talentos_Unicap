<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Recuperar Senha - TalentoUNICAP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Schibsted+Grotesk:wght@600;700;800&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <link rel="icon" type="image/png" href="img/asabranca_Unicap.png">
 <link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/tema-unicap.css">
<link rel="stylesheet" href="css/interno.css">
</head>
<body>
  <nav class="navbar" data-area="simples"></nav>
  <script src="js/components/navbar.js"></script>
  <div class="auth-page">
    <div class="card auth-card"><div class="card-body">
      <h1>Recuperar Senha</h1>
      <p class="subtitle">Informe o e-mail cadastrado e enviaremos um link para criar uma nova senha.</p>
      <div id="feedback" class="error-msg hidden"></div>
      <form id="form">
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" id="email" placeholder="seu@email.com" required>
        </div>
        <button type="submit" class="btn btn-primary w-full" id="btn">Enviar link</button>
      </form>
      <p class="auth-foot"><a href="login.html">Voltar para o login</a></p>
    </div></div>
  </div>
  <footer class="footer">© 2026 TalentoUNICAP — Universidade Católica de Pernambuco</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config/config.js"></script>
  <script src="js/config/supabase-client.js"></script>
  <script src="js/security/auth.js"></script>
  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const btn = document.getElementById('btn');
      const feedback = document.getElementById('feedback');

      btn.disabled = true;
      btn.textContent = 'Enviando...';
      feedback.classList.add('hidden');

      try {
        await Auth.sendPasswordReset(email);
        feedback.className = '';
        feedback.style.cssText = 'padding:12px;border-radius:8px;background:#ecfdf5;color:#166534;font-size:13px;margin-bottom:16px;';
        feedback.textContent = 'Se existir uma conta com esse e-mail, enviaremos as instruções para redefinir a senha.';
        document.getElementById('form').style.display = 'none';
      } catch (error) {
        feedback.classList.remove('hidden');
        feedback.textContent = error.message || 'Não foi possível enviar o link.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Enviar link';
      }
    });
  </script>
  <script src="js/utils/ux.js" defer></script>
  <script src="js/utils/mobile-nav.js" defer></script>
<script src="js/components/theme-toggle.js"></script>
<script src="js/components/scroll-fx.js"></script>
  <script src="js/components/bg-icons.js" defer></script>
</body>
</html>
