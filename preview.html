<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Pré-visualização do Currículo - TalentoUNICAP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Schibsted+Grotesk:wght@600;700;800&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <link rel="icon" type="image/png" href="img/asabranca_Unicap.png">
  <link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/tema-unicap.css">
<link rel="stylesheet" href="css/interno.css">
</head>

<body>
  <nav class="navbar" data-area="aluno"></nav>
  <script src="js/components/navbar.js"></script>
  <div class="container page-shell">
    <div class="page-head"
     >
      <h1 class="page-title">Pré-visualização do Currículo</h1>
      <div class="row-gap row-gap--lg">
        <label class="inline-check">
          <input type="checkbox" id="toggleLogo" checked onchange="onToggleLogo()">
          Incluir logo da UNICAP
        </label>
        <div class="row-gap">
          <button class="btn btn-secondary" onclick="exportPDF()">
            <div class="icon"><i class="ph-bold ph-scroll"></i></div> Exportar PDF
          </button>
          <button id="btnExportDocx" class="btn btn-primary"
            onclick="exportDOCX(document.getElementById('toggleLogo').checked)">
            <i class="ph-bold ph-floppy-disk"></i> Exportar DOCX
          </button>
        </div>
      </div>
    </div>
    <div class="cv-sheet" id="cvContent"
     >
      <div class="cv-loading">Carregando...</div>
    </div>
  </div>
  <footer class="footer">© 2026 TalentoUNICAP — Universidade Católica de Pernambuco</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config/config.js"></script>
  <script src="js/utils/escape.js"></script>
  <script src="js/config/supabase-client.js"></script>
  <script src="js/services/aluno-service.js"></script>
  <script src="js/services/export-service.js"></script>
  <script src="js/security/auth.js"></script>
  <script>
    let profile = null;

    function onToggleLogo() {
      if (!profile) return;
      const showLogo = document.getElementById('toggleLogo').checked;
      document.getElementById('cvContent').innerHTML = renderCVPreview(profile, showLogo, 'h2');
    }

    Auth.onAuthChange = async function (loggedIn) {
      if (!loggedIn) {
        window.location.href = 'login.html';
        return;
      }

      try {
        profile = await API.getCurriculo();

        console.log('Perfil recebido pelo Preview:', profile);

        if (!profile || profile.error) {
          throw new Error(
            profile?.error || 'Não foi possível carregar o currículo.'
          );
        }

        const showLogo =
          document.getElementById('toggleLogo').checked;

        document.getElementById('cvContent').innerHTML =
          renderCVPreview(profile, showLogo, 'h2');

      } catch (error) {
        console.error('Erro ao carregar Preview:', error);

        document.getElementById('cvContent').innerHTML = `
      <div class="cv-loading">
        <h3>Não foi possível carregar o currículo</h3>
        <p class="text-muted mt-2">
          ${error.message || 'Erro desconhecido.'}
        </p>
      </div>
    `;
      }
    };
    Auth.init();
  </script>
  <script src="js/utils/page-nav.js" defer></script>
  <script src="js/utils/ux.js" defer></script>
  <script src="js/utils/mobile-nav.js" defer></script>
<script src="js/components/theme-toggle.js"></script>
<script src="js/components/scroll-fx.js"></script>
  <script src="js/components/bg-icons.js" defer></script>
</body>

</html>
