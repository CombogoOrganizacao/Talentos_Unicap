<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Mensagens Enviadas - TalentoUNICAP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Schibsted+Grotesk:wght@600;700;800&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <link rel="icon" type="image/png" href="img/asabranca_Unicap.png">
  <link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/tema-unicap.css">
<link rel="stylesheet" href="css/interno.css">
</head>

<body>
  <nav class="navbar" data-area="empresa"></nav>
  <script src="js/components/navbar.js"></script>

  <div class="container page-shell page-shell--inbox">
    <div class="page-intro">
      <h1 class="page-title">Mensagens Enviadas</h1>
      <p class="page-desc">Acompanhe o status das mensagens enviadas aos candidatos e gerencie seus contatos.</p>
    </div>

    <div class="msg-toolbar">
      <div class="search-box">
        <i class="ph ph-magnifying-glass"></i>
        <input type="search" id="buscaMsg" placeholder="Buscar por candidato ou assunto...">
      </div>
      <select id="filtroStatusMsg">
        <option value="">Status: Todos</option>
        <option value="Enviada">Enviada</option>
        <option value="Lida">Lida</option>
        <option value="Respondida">Respondida</option>
      </select>
      <select id="filtroPeriodoMsg">
        <option value="0">Período: Todo o período</option>
        <option value="7">Últimos 7 dias</option>
        <option value="30" selected>Últimos 30 dias</option>
        <option value="90">Últimos 90 dias</option>
      </select>
    </div>

    <div id="msgList"></div>

    <div class="empty-state" id="emptyMsgState" hidden>
      <div class="icon"><i class="ph-fill ph-chat-circle-dots"></i></div>
      <h2>Nenhuma mensagem enviada ainda</h2>
      <p>Vá até a busca de talentos e entre em contato com candidatos.</p>
      <a class="btn btn-primary" href="busca-talentos.html">Buscar Talentos</a>
    </div>
  </div>

  <footer class="footer">© 2026 TalentoUNICAP — Universidade Católica de Pernambuco</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config/config.js"></script>
  <script src="js/utils/escape.js"></script>
  <script src="js/config/supabase-client.js"></script>
  <script src="js/services/aluno-service.js"></script>
  <script src="js/security/auth.js"></script>
  <script src="js/services/empresa-service.js"></script>
  <script src="js/services/mensagem-service.js"></script>
  <script src="js/pages/caixa-saida-empresa.js"></script>
  <script src="js/utils/page-nav.js" defer></script>
  <script src="js/utils/ux.js" defer></script>
  <script src="js/utils/mobile-nav.js" defer></script>
<script src="js/components/theme-toggle.js"></script>
<script src="js/components/scroll-fx.js"></script>
  <script src="js/components/bg-icons.js" defer></script>
</body>

</html>
