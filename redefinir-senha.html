<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Senha - TalentoUNICAP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Schibsted+Grotesk:wght@600;700;800&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <link rel="icon" type="image/png" href="img/asabranca_Unicap.png">
  <link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/tema-unicap.css">
<link rel="stylesheet" href="css/interno.css">
</head>
<body>
  <nav class="navbar" data-area="simples"></nav>
  <script src="js/components/navbar.js"></script>
  <div class="auth-page">
    <div class="card auth-card"><div class="card-body">
      <h1>Crie uma nova senha</h1>
      <p class="subtitle">Escolha uma senha nova para acessar sua conta.</p>
      <div id="feedback" class="error-msg hidden"></div>
      <form id="form">
        <div class="form-group">
          <label>Nova senha</label>
          <input type="password" id="password" minlength="6" placeholder="Mínimo 6 caracteres" required>
        </div>
        <div class="form-group">
          <label>Confirmar nova senha</label>
          <input type="password" id="confirm" minlength="6" placeholder="Repita a nova senha" required>
        </div>
        <button type="submit" class="btn btn-primary w-full" id="btn">Salvar nova senha</button>
      </form>
      <p id="loginLink" style="text-align:center;margin-top:20px;font-size:14px;display:none;"><a href="login.html">Ir para o login</a></p>
    </div></div>
  </div>
  <footer class="footer">© 2026 TalentoUNICAP — Universidade Católica de Pernambuco</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config/config.js"></script>
  <script src="js/config/supabase-client.js"></script>
  <script src="js/security/auth.js"></script>
  <script>
    let recoveryReady = false;

    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY' && session) recoveryReady = true;
    });

    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) recoveryReady = true;
    })();

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      const btn = document.getElementById('btn');
      const feedback = document.getElementById('feedback');

      feedback.classList.add('hidden');
      if (password.length < 6) {
        feedback.textContent = 'A senha deve ter pelo menos 6 caracteres.';
        feedback.classList.remove('hidden');
        return;
      }
      if (password !== confirm) {
        feedback.textContent = 'As senhas não coincidem.';
        feedback.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Salvando...';

      try {
        await Auth.updatePassword(password);
        document.getElementById('form').style.display = 'none';
        feedback.className = '';
        feedback.style.cssText = 'padding:12px;border-radius:8px;background:#ecfdf5;color:#166534;font-size:13px;';
        feedback.textContent = 'Senha alterada com sucesso. Agora você pode entrar normalmente.';
        document.getElementById('loginLink').style.display = 'block';
      } catch (error) {
        feedback.classList.remove('hidden');
        feedback.textContent = error.message || 'Não foi possível alterar a senha. Solicite um novo link.';
        btn.disabled = false;
        btn.textContent = 'Salvar nova senha';
      }
    });
  </script>
  <script src="js/utils/ux.js" defer></script>
  <script src="js/utils/mobile-nav.js" defer></script>
<script src="js/components/theme-toggle.js"></script>
<script src="js/components/scroll-fx.js"></script>
  <script src="js/components/bg-icons.js" defer></script>
</body>
</html>
